services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zotpool
      POSTGRES_PASSWORD: zotpool
      POSTGRES_DB: zotpool
    ports:
      - "5432:5432"
    volumes:
      - zotpool-postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zotpool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://zotpool:zotpool@postgres:5432/zotpool
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: .
      target: builder
    command: ["npm", "run", "dev:realtime"]
    environment:
      REALTIME_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - app

volumes:
  zotpool-postgres:
